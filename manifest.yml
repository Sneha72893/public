app:
  id: ari:cloud:ecosystem::app/1f334f78-b820-49bf-a1ea-152151d3ada5
  runtime:
    name: nodejs22.x

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - manage:jira-project
    - read:jira-user
    - read:confluence-content.all
    - write:confluence-content
    - read:confluence-space.summary
    - storage:app
  external:
    fetch:
      backend:
        - address: https://api.github.com
        - address: https://hooks.slack.com
        - address: https://outlook.office.com
        - address: https://outlook.office365.com

modules:
  # ─── Web Trigger ─────────────────────────────────────────────────────────────
  # Receives GitHub workflow_run webhook events (public HTTPS endpoint)
  webtrigger:
    - key: github-webhook-receiver
      function: handleGithubWebhook

  # ─── Scheduled Trigger ───────────────────────────────────────────────────────
  # Polls every 5 minutes for overdue SLA incidents and escalates them
  scheduledTrigger:
    - key: sla-monitor-trigger
      function: runSlaMonitor
      interval: fiveMinute

  # ─── Jira Issue Update Trigger ───────────────────────────────────────────────
  # Fires when any Jira issue is updated (filtered to resolution in handler)
  trigger:
    - key: incident-resolution-handler
      function: handleResolution
      events:
        - avi:jira:updated:issue

  # ─── Jira Issue Panel ────────────────────────────────────────────────────────
  # Renders a live incident dashboard widget on Jira incident issues
  jira:issuePanel:
    - key: incident-detail-panel
      title: "🚨 Incident Details"
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: incident-panel
      resolver:
        function: incidentPanelResolver

  # ─── Jira Admin Page ─────────────────────────────────────────────────────────
  # Admin settings: project key, escalation users, Confluence space, etc.
  jira:adminPage:
    - key: incident-admin-settings
      title: "Incident Response Settings"
      resource: admin-panel
      resolver:
        function: adminPanelResolver

  # ─── Functions ───────────────────────────────────────────────────────────────
  function:
    - key: handleGithubWebhook
      handler: index.handleGithubWebhook

    - key: runSlaMonitor
      handler: index.runSlaMonitor

    - key: handleResolution
      handler: index.handleResolution

    - key: incidentPanelResolver
      handler: index.incidentPanelResolver

    - key: adminPanelResolver
      handler: index.adminPanelResolver

resources:
  - key: admin-panel
    path: static/admin-panel/dist
    tunnel:
      port: 5173
  - key: incident-panel
    path: static/admin-panel/dist
    tunnel:
      port: 5173
